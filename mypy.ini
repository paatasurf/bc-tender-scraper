[mypy]
# Phase 1 quality gate: catch clear defects (undefined attributes, wrong
# arg counts, obvious type mismatches) without demanding full strict typing
# across a large pre-existing codebase in one pass. Mirrors ruff.toml's
# "serious defects only" philosophy for this same infrastructure phase.
python_version = 3.12
ignore_missing_imports = True
follow_imports = silent
warn_redundant_casts = True
warn_unused_ignores = False
check_untyped_defs = False
disallow_untyped_defs = False
