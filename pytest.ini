[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
markers =
    integration: tests that require local Postgres or live services
    safety: production safety / db_safety guards

[coverage:run]
branch = true
source =
    api
    db
    pipeline
    intelligence
omit =
    */tests/*
    */scripts/*

[coverage:report]
show_missing = true
skip_covered = false
precision = 1
