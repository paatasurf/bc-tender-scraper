# TenderScope — True CI/CD Pipeline (bc-tender-scraper)
#
# Engineering infrastructure only. No business-logic changes.
# The required Quality Gate (ruff, black, pip-audit, pytest, opencode-review)
# is blocking; any of those failing stops the pipeline. mypy, Semgrep, and
# Schemathesis are advisory: they always run, always publish findings/
# artifacts and a job-summary warning, but a finding never fails the job,
# the overall workflow run, or blocks a deploy -- see the "Stage 1.6"
# comment below for why, and tests/unit/test_ci_workflow_advisory_scanners.py
# for the regression test on this exact property.
# Railway deployment can only occur after the Quality Gate succeeds.
# Docs: docs/engineering/

name: Quality Gate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: quality-gate-scraper-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Never point CI at production. Empty URL → DB-dependent tests skip safely.
  DATABASE_URL: ""
  DATABASE_URL_PRODUCTION: ""
  ALLOW_MANUAL_PIPELINE: "false"
  SCHEDULER_ENABLED: "false"
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1 — Fast static checks (run in parallel)
  # ---------------------------------------------------------------------------
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Static analysis (changed files only)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          else
            echo "No diff available; skipping Ruff check."
            echo "ruff_check=skipped"
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACMRT "$base" "$head" | grep '\.py$' || true)
          if [ -z "$files" ]; then
            echo "No Python files changed; skipping Ruff check."
            echo "ruff_check=skipped"
            exit 0
          fi
          count=$(printf '%s' "$files" | grep -c . || echo 0)
          echo "Checking Ruff for $count changed file(s):"
          echo "$files"
          ruff check $files --config ruff.toml
          echo "ruff_check=ok"

  black:
    name: Black
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Black
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install black>=24.0

      - name: Format check (changed files only)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.event.after }}"
          else
            echo "No diff available; skipping Black check."
            echo "black_check=skipped"
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACMRT "$base" "$head" | grep '\.py$' || true)
          if [ -z "$files" ]; then
            echo "No Python files changed; skipping Black check."
            echo "black_check=skipped"
            exit 0
          fi
          count=$(printf '%s' "$files" | grep -c . || echo 0)
          echo "Checking Black formatting for $count changed file(s):"
          echo "$files"
          black --check $files
          echo "black_check=ok"

  # ---------------------------------------------------------------------------
  # Stage 1.5 — Dependency vulnerability audit
  # ---------------------------------------------------------------------------
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pip-audit
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Audit production + development dependencies
        run: |
          set -euo pipefail
          pip-audit --requirement=requirements.txt --requirement=requirements-dev.txt

  # ---------------------------------------------------------------------------
  # Stage 1.6 — New quality scanners (Phase 1 hardening) — ADVISORY ONLY
  #
  # These three jobs (mypy, semgrep, schemathesis) always run, always save
  # findings/artifacts, and always surface a warning in the job summary --
  # but their scan step carries `continue-on-error: true`, so a scanner
  # finding does not fail the job, does not fail the overall workflow run,
  # and cannot block a deploy (deploy only ever gates on quality-gate's
  # `needs:`, which does not include these three -- see that job).
  #
  # NONE of them is in quality-gate's `needs:` below yet -- that is a
  # deliberate, separate decision. mypy alone currently reports 268
  # pre-existing findings across 79 files; Semgrep 79 findings; Schemathesis
  # 4 expected-503 "server errors" (see the corresponding CI PRs' findings
  # write-ups). Promote each to blocking (add to quality-gate's `needs:` AND
  # drop its `continue-on-error: true`) individually, once its first-run
  # findings have been triaged. Gitleaks is the strongest immediate
  # candidate: secret detection has a much lower false-positive rate than a
  # fresh type/lint pass on a large existing codebase (it has no
  # continue-on-error and is a real, hard failure today).
  #
  # tests/unit/test_ci_workflow_advisory_scanners.py asserts these
  # invariants structurally (continue-on-error present, none of the three
  # in quality-gate's needs, deploy's needs is exactly [quality-gate]) so a
  # future edit can't silently regress this.
  # ---------------------------------------------------------------------------
  mypy:
    name: mypy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Type check (mypy.ini -- Phase 1 narrow ruleset, see file comment)
        id: typecheck
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports
          python -m mypy --config-file mypy.ini api db pipeline scraper | tee reports/mypy.txt

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Advisory summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.typecheck.outcome }}" = "failure" ]; then
            finding_line=$(grep -E '^Found [0-9]+ errors? in [0-9]+ files?' reports/mypy.txt || echo "mypy reported errors")
            echo "## ⚠️ mypy (advisory, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "$finding_line — see the uploaded mypy-report artifact for details." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::mypy: $finding_line (advisory only — not in the required Quality Gate)"
          else
            echo "## ✅ mypy (advisory)" >> "$GITHUB_STEP_SUMMARY"
            echo "No errors." >> "$GITHUB_STEP_SUMMARY"
          fi

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Semgrep
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install semgrep

      - name: Semgrep scan (community rulesets -- no SEMGREP_APP_TOKEN needed)
        id: semgrepscan
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports
          # Semgrep's human-readable "Scan Status"/"Scan Summary" (including
          # the "Findings: N" / "Ran N rules on N files: N findings." lines
          # the Advisory summary step below greps for) go to stderr, not
          # stdout -- `2>&1` before the pipe merges both streams into
          # reports/semgrep.txt so it's no longer silently empty (the SARIF
          # file was always complete; only this human-readable capture was
          # affected). `pipefail` (set above) still propagates semgrep's own
          # exit code through `tee`, unaffected by the stream merge.
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/python \
            --sarif --output reports/semgrep.sarif \
            --error \
            . 2>&1 | tee reports/semgrep.txt

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

      - name: Advisory summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.semgrepscan.outcome }}" = "failure" ]; then
            finding_line=$(grep -E '^Ran [0-9]+ rules? on [0-9]+ files?: [0-9]+ findings?\.' reports/semgrep.txt || echo "Semgrep reported findings")
            echo "## ⚠️ Semgrep (advisory, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "$finding_line — see the uploaded semgrep-report artifact (SARIF) for details." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Semgrep: $finding_line (advisory only — not in the required Quality Gate)"
          else
            echo "## ✅ Semgrep (advisory)" >> "$GITHUB_STEP_SUMMARY"
            echo "No findings." >> "$GITHUB_STEP_SUMMARY"
          fi

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history so Gitleaks can resolve commit ranges)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Stage 2 — Test suite
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Fresh, disposable Postgres service scoped to THIS job only -- no other
    # job (ruff/black/pip-audit/mypy/semgrep/gitleaks/opencode-review/deploy)
    # gets a database, and this service never touches production data. A
    # brand-new container every run, destroyed when the job ends.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenderscope_ci
          POSTGRES_PASSWORD: tenderscope_ci
          POSTGRES_DB: tenderscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenderscope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Overrides the workflow-level empty DATABASE_URL for this job only,
      # pointing at the fresh service container above -- never production.
      # CI_DATABASE_URL is the explicit opt-in tests/db_test_safety.py
      # checks before running any DB-integration test on CI (see that
      # file's _ci_skips_db_integration()); without it those tests skip.
      DATABASE_URL: postgresql://tenderscope_ci:tenderscope_ci@localhost:5432/tenderscope_test
      CI_DATABASE_URL: postgresql://tenderscope_ci:tenderscope_ci@localhost:5432/tenderscope_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime + development dependencies
        id: deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations (fresh CI Postgres -- never production)
        run: |
          set -euo pipefail
          python scripts/ci_apply_all_migrations.py

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q api db pipeline intelligence config scraper
          echo "syntax_check=ok"

      - name: Import smoke (core packages)
        run: |
          python - <<'PY'
          import importlib
          mods = [
              "api.main",
              "db.models",
              "db.db_safety",
              "pipeline.unified_opportunities",
              "pipeline.competitive_intel.service",
              "pipeline.company_resolution",
              "pipeline.company_canonical_merge",
          ]
          failed = []
          for name in mods:
              try:
                  importlib.import_module(name)
                  print(f"OK  {name}")
              except Exception as exc:  # noqa: BLE001 — report all import failures
                  failed.append((name, exc))
                  print(f"FAIL {name}: {exc}")
          if failed:
              raise SystemExit(1)
          print("import_smoke=ok")
          PY

      - name: Unit test suite
        run: |
          set -euo pipefail
          mkdir -p reports
          # tests/unit/test_website_contact_provider.py and
          # tests/unit/test_enrichment_worker.py are both ignored here --
          # each imports WebsiteContactProvider (directly, or via
          # worker/app.py), which pulls in extruct/trafilatura at module
          # level (pipeline/company_enrichment/website_contact_provider.py),
          # and this job deliberately never installs those (requirements.txt
          # only, no browser deps -- see
          # requirements-company-enrichment-worker.txt and
          # worker/requirements.txt). Both files are fully covered by the
          # enrichment-worker-tests job below instead, which installs the
          # worker requirements and runs them as a required (blocking) check.
          pytest tests/unit \
            --ignore=tests/unit/test_website_contact_provider.py \
            --ignore=tests/unit/test_enrichment_worker.py \
            -v \
            --tb=short \
            --cov=api --cov=db --cov=pipeline --cov=intelligence --cov=scraper \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml:reports/coverage.xml \
            --junitxml=reports/unit-junit.xml \
            | tee reports/pytest-unit.txt

      - name: Coverage summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f reports/coverage.xml ]; then
            echo "No coverage.xml produced (test run failed before writing it)."
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET

          root = ET.parse("reports/coverage.xml").getroot()
          line_rate = float(root.attrib.get("line-rate", "0")) * 100
          branch_rate = float(root.attrib.get("branch-rate", "0")) * 100
          lines_covered = root.attrib.get("lines-covered", "?")
          lines_valid = root.attrib.get("lines-valid", "?")
          print("## Coverage summary")
          print(f"- Line coverage: **{line_rate:.1f}%** ({lines_covered}/{lines_valid} lines)")
          print(f"- Branch coverage: **{branch_rate:.1f}%**")
          print("- Full report: `reports/coverage.xml` (see uploaded artifact)")
          PY

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Stage 2b — Company-enrichment worker test suite
  #
  # WebsiteContactProvider (pipeline/company_enrichment/website_contact_provider.py)
  # imports extruct/trafilatura at module level, so its own test file
  # (tests/unit/test_website_contact_provider.py) -- and worker/app.py's own
  # test file (tests/unit/test_enrichment_worker.py), which imports
  # WebsiteContactProvider transitively -- cannot even be COLLECTED by the
  # main `pytest` job above, which deliberately installs only
  # requirements.txt (no browser/scraping deps -- see
  # requirements-company-enrichment-worker.txt and worker/requirements.txt,
  # and docs/COMPANY_CONTACT_PROVIDER_PHASE3A_RUNTIME_DECISION.md for why
  # that isolation exists: crawl4ai/Playwright must never land in the main
  # Nixpacks-built production API's build). This job installs BOTH
  # requirements.txt AND requirements-company-enrichment-worker.txt into its
  # own separate runner -- the main `pytest` job's environment above is
  # completely unaffected -- and runs the provider's own tests, the worker
  # HTTP contract's own tests, and the rest of the company_enrichment
  # regression suite that must stay green alongside them, as a required
  # (blocking) check.
  #
  # No `playwright install <browser>` step here: every test in this suite
  # mocks _fetch_rendered_page / _redirect_walk / _check_robots /
  # _ssrf_and_dns_check at the module boundary (unittest.mock.patch against
  # MODULE = "pipeline.company_enrichment.website_contact_provider") -- no
  # test here ever launches a real browser, so the ~150-300MB browser
  # binary download is not needed to run it.
  # ---------------------------------------------------------------------------
  enrichment-worker-tests:
    name: Enrichment Worker Tests (provider + regression)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenderscope_ci
          POSTGRES_PASSWORD: tenderscope_ci
          POSTGRES_DB: tenderscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenderscope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tenderscope_ci:tenderscope_ci@localhost:5432/tenderscope_test
      CI_DATABASE_URL: postgresql://tenderscope_ci:tenderscope_ci@localhost:5432/tenderscope_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install main + worker + dev dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-company-enrichment-worker.txt
          pip install -r requirements-dev.txt

      - name: Run database migrations (fresh CI Postgres -- never production)
        run: |
          set -euo pipefail
          python scripts/ci_apply_all_migrations.py

      - name: Provider + enrichment regression suite
        run: |
          set -euo pipefail
          mkdir -p reports
          pytest \
            tests/unit/test_website_contact_provider.py \
            tests/unit/test_company_enrichment_cache.py \
            tests/unit/test_company_enrichment_dedup.py \
            tests/unit/test_company_enrichment_migration.py \
            tests/unit/test_company_enrichment_orchestrator.py \
            tests/unit/test_company_enrichment_provider.py \
            tests/unit/test_internal_enrichment_route.py \
            tests/unit/test_enrichment_worker.py \
            -v \
            --tb=short \
            --junitxml=reports/enrichment-worker-junit.xml \
            | tee reports/pytest-enrichment-worker.txt

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enrichment-worker-reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Stage 2.5 — API contract checks (Phase 1 hardening; reporting only, see
  # the note on the mypy/semgrep/gitleaks jobs above for why nothing new in
  # this PR is wired into quality-gate's `needs:` yet)
  # ---------------------------------------------------------------------------
  schemathesis:
    name: Schemathesis (OpenAPI, GET-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tenderscope_ci
          POSTGRES_PASSWORD: tenderscope_ci
          POSTGRES_DB: tenderscope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tenderscope_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://tenderscope_ci:tenderscope_ci@localhost:5432/tenderscope_test
      SCHEDULER_ENABLED: "false"
      # INTERNAL_API_KEY is deliberately left UNSET: every /internal/* route
      # must 403 a Schemathesis probe rather than execute real logic, since
      # several of those routes trigger live external HTTP scraping. Do not
      # set this secret in this job.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install schemathesis uvicorn

      - name: Run database migrations (fresh CI Postgres -- never production)
        run: |
          set -euo pipefail
          python scripts/ci_apply_all_migrations.py

      - name: Start API server
        run: |
          set -euo pipefail
          nohup python -m uvicorn api.main:app --host 127.0.0.1 --port 8000 \
            > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null 2>&1; then
              echo "server_ready=ok"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API server did not become ready"
          cat server.log
          exit 1

      - name: Schemathesis (GET-only, positive-mode -- safe reporting run)
        id: schemathesis_run
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p reports
          schemathesis run \
            http://127.0.0.1:8000/openapi.json \
            --url http://127.0.0.1:8000 \
            --include-method GET \
            --mode positive \
            --max-examples 10 \
            --checks not_a_server_error \
            --report junit \
            --report-dir reports/schemathesis \
            --no-color \
            | tee reports/schemathesis.txt

      - name: Server log
        if: always()
        run: cat server.log || true

      - name: Upload Schemathesis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schemathesis-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

      - name: Advisory summary
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.schemathesis_run.outcome }}" = "failure" ]; then
            finding_line=$(grep -E '^[0-9]+ failures?, [0-9]+ warnings? in' reports/schemathesis.txt || echo "Schemathesis reported failures")
            echo "## ⚠️ Schemathesis (advisory, non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "$finding_line — see the uploaded schemathesis-report artifact for details." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::Schemathesis: $finding_line (advisory only — not in the required Quality Gate)"
          else
            echo "## ✅ Schemathesis (advisory)" >> "$GITHUB_STEP_SUMMARY"
            echo "No failures." >> "$GITHUB_STEP_SUMMARY"
          fi

  openapi-contract:
    name: OpenAPI contract (cross-repo consumers, e.g. voice-n8n-agent)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diff live schema against contracts/openapi-baseline.json
        run: |
          set -euo pipefail
          mkdir -p reports
          python scripts/check_openapi_contract.py | tee reports/openapi-contract.txt

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi-contract-report-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Stage 3 — Optional AI code review
  # ---------------------------------------------------------------------------
  opencode-review:
    name: OpenCode Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    env:
      OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: OpenCode review
        run: |
          set -euo pipefail
          if [ -z "$OPENCODE_API_KEY" ]; then
            echo "opencode_review=skipped_no_api_key"
            echo "::warning::OpenCode review skipped (OPENCODE_API_KEY secret not configured)"
            exit 0
          fi
          echo "OpenCode review would run here."
          echo "Replace this step with the OpenCode CLI or GitHub Action integration."
          echo "Example: opencode review --repo ${{ github.repository }} --pr ${{ github.event.pull_request.number }}"
          echo "opencode_review=ok"

  # ---------------------------------------------------------------------------
  # Stage 4 — Aggregate gate
  # Fails if any upstream stage failed, otherwise produces the CI report.
  # This job name is the required status check for branch protection.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: [ruff, black, pip-audit, pytest, opencode-review, enrichment-worker-tests]
    runs-on: ubuntu-latest
    if: always()
    timeout-minutes: 10
    steps:
      - name: Evaluate quality gate
        env:
          RUFF_RESULT: ${{ needs.ruff.result }}
          BLACK_RESULT: ${{ needs.black.result }}
          PIP_AUDIT_RESULT: ${{ needs.pip-audit.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          OPENCODE_RESULT: ${{ needs.opencode-review.result }}
          ENRICHMENT_WORKER_RESULT: ${{ needs.enrichment-worker-tests.result }}
        run: |
          set -euo pipefail
          echo "Ruff:               $RUFF_RESULT"
          echo "Black:              $BLACK_RESULT"
          echo "pip-audit:          $PIP_AUDIT_RESULT"
          echo "pytest:             $PYTEST_RESULT"
          echo "OpenCode:           $OPENCODE_RESULT"
          echo "Enrichment worker:  $ENRICHMENT_WORKER_RESULT"

          failed=""
          for job in ruff black pip-audit pytest opencode-review enrichment-worker-tests; do
            case "$job" in
              ruff) result="$RUFF_RESULT" ;;
              black) result="$BLACK_RESULT" ;;
              pip-audit) result="$PIP_AUDIT_RESULT" ;;
              pytest) result="$PYTEST_RESULT" ;;
              opencode-review) result="$OPENCODE_RESULT" ;;
              enrichment-worker-tests) result="$ENRICHMENT_WORKER_RESULT" ;;
            esac
            if [ "$result" = "success" ]; then
              continue
            fi
            # PR-only job: skipped on push/workflow_dispatch must not fail the gate.
            if [ "$job" = "opencode-review" ] && [ "$result" = "skipped" ]; then
              continue
            fi
            failed="$failed $job($result)"
          done

          if [ -n "$failed" ]; then
            echo "quality_gate=failed:$failed"
            exit 1
          fi

          echo "quality_gate=passed"

  # ---------------------------------------------------------------------------
  # Stage 5 — Deployment (master only, gated by Quality Gate)
  #
  # Uses the Railway CLI to deploy explicitly after all checks pass.
  # Requires the RAILWAY_TOKEN secret (project token) to be configured.
  # NOTE: To avoid double deployments, disable Railway auto-deploy in the
  # service settings once this job is active. Keep Railway "Wait for CI"
  # enabled as a safety net so that auto-deploy (if ever re-enabled) never
  # runs on a red pipeline.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Railway
    needs: [quality-gate]
    runs-on: ubuntu-latest
    if: always() && github.ref == 'refs/heads/master' && github.event_name == 'push' && needs.quality-gate.result == 'success'
    environment:
      name: production
      url: https://bc-tender-scraper-production.up.railway.app
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          set -euo pipefail
          bash <(curl -fsSL cli.new)
          # The installer only wires `railway` into ~/.bash_profile for future
          # login shells; each subsequent step here runs a fresh non-login
          # shell that won't source it. Export the install dir via
          # GITHUB_PATH so later steps in this job can find the binary.
          echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy to Railway
        id: railway_deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::RAILWAY_TOKEN secret is not configured"
            exit 1
          fi
          railway up --ci \
            --service d882ae62-cf45-47f3-85ee-54d1c2eaa628 \
            --environment production
          echo "deploy=ok"

      - name: Post-deploy health check
        env:
          DEPLOY_URL: https://bc-tender-scraper-production.up.railway.app
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "Waiting for $DEPLOY_URL/api/health ..."
          for i in {1..30}; do
            response=$(curl -fsS "$DEPLOY_URL/api/health" || true)
            if [ -n "$response" ]; then
              echo "health_response=$response"
              echo "health_check=ok"
              break
            fi
            echo "Attempt $i/30: health endpoint not ready, retrying in 10s..."
            sleep 10
          done

          if [ "$i" = "30" ]; then
            echo "health_check=failed"
            exit 1
          fi

          echo "Verifying deployed commit SHA..."
          deployed_sha=$(curl -fsS "$DEPLOY_URL/api/health" | python -c "import sys, json; print(json.load(sys.stdin).get('commit_sha', ''))" || true)
          if [ -n "$deployed_sha" ] && [ "$deployed_sha" != "$EXPECTED_SHA" ]; then
            echo "deployed_sha=$deployed_sha"
            echo "expected_sha=$EXPECTED_SHA"
            echo "::warning::Deployed SHA does not match expected commit SHA"
          else
            echo "commit_sha_verified=ok"
          fi
